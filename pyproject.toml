[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceroot"
version = "0.1.0"
description = "Failure Localization and Diagnosis for Tool-Using AI Agents"
readme = "README.md"
authors = [{ name = "TraceRoot Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1.0",
    "rich>=13.5.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
inspect = [
    "inspect-ai>=0.3.0",
]
llm = [
    "openai>=1.10.0",
    "anthropic>=0.15.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "traceroot[inspect,llm,dev]",
]

[project.scripts]
traceroot = "traceroot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["traceroot*"]

[tool.setuptools.package-data]
traceroot = [
    "reporting/templates/*.jinja2",
    "taxonomy/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
